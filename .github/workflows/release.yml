name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.6.0)
        required: true
        type: string

jobs:
  publish:
    name: Publish @catp-protocol/cli to npm
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify checked out commit matches release tag
        shell: bash
        run: |
          git fetch --tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checkout HEAD $HEAD_COMMIT does not match tag $RELEASE_TAG commit $TAG_COMMIT" >&2
            exit 1
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type check
        working-directory: catp-plugin
        run: npm run typecheck

      - name: Run tests
        working-directory: catp-plugin
        run: npm test

      - name: Build
        working-directory: catp-plugin
        run: npm run build

      - name: Check release version
        id: release-version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./catp-plugin/package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match catp-plugin/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          if npm view "@catp-protocol/cli@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@catp-protocol/cli@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@catp-protocol/cli@$PACKAGE_VERSION is not published yet; publishing from this workflow."
          fi

      - name: Publish
        if: steps.release-version.outputs.published != 'true'
        working-directory: catp-plugin
        run: npm publish --access public
